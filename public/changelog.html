<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's New — The Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Spectral+SC:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="fog"></div>
<div class="wrap" style="max-width:820px;">
  <div class="top-nav"><a class="link-btn" href="index.html">&larr; Back to The Ledger</a></div>
  <div class="eyebrow">Remote Tabletop</div>
  <h1 style="font-family:'Spectral',serif;color:var(--parchment);margin-bottom:6px;">What's New &amp; What's Next</h1>
  <p class="helptext" style="margin-bottom:32px;">A running log of what's shipped, and what's planned next for The Ledger.</p>

  <h2 class="changelog-section-title">Coming Soon</h2>
  <div id="roadmapList" class="changelog-list"></div>

  <h2 class="changelog-section-title" style="margin-top:36px;">Changelog</h2>
  <div id="changelogList" class="changelog-list"></div>

  <div id="supportFooter"></div>
</div>

<script src="config.js"></script>
<script src="changelog-data.js"></script>
<script>
function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escapeAttr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

const cfg = (window.LEDGER_CONFIG || {});
const SUPPORT_URL = (cfg.SUPPORT_URL || '').trim();
let CONTACT_EMAIL = (cfg.CONTACT_EMAIL || '').trim();
function renderSupportFooter() {
  if (!(SUPPORT_URL || CONTACT_EMAIL)) return;
  const parts = [];
  if (CONTACT_EMAIL) parts.push(`Found a bug or have a suggestion? <a href="mailto:${escapeAttr(CONTACT_EMAIL)}">Email ${escapeAttr(CONTACT_EMAIL)}</a>`);
  if (SUPPORT_URL) parts.push(`Enjoying The Ledger? <a href="${escapeAttr(SUPPORT_URL)}" target="_blank" rel="noopener">Buy me a coffee ☕</a>`);
  document.getElementById('supportFooter').outerHTML = `<div class="footer-contact" id="supportFooter" style="margin-top:36px;">${parts.join(' &middot; ')}</div>`;
}
renderSupportFooter();
// The support email comes from the SUPPORT_EMAIL Netlify variable; config.js is the fallback.
fetch('/api/site-config').then(r => r.ok ? r.json() : null).then(d => {
  const email = d && String(d.supportEmail || '').trim();
  if (email && email !== CONTACT_EMAIL) { CONTACT_EMAIL = email; renderSupportFooter(); }
}).catch(() => {});

document.getElementById('roadmapList').innerHTML = (window.LEDGER_ROADMAP || []).map(item => `
  <div class="changelog-entry">
    <div class="changelog-entry-title">${escapeHtml(item.title)}</div>
    <p class="changelog-entry-detail">${escapeHtml(item.detail)}</p>
  </div>`).join('') || '<p class="helptext">Nothing queued right now.</p>';

document.getElementById('changelogList').innerHTML = (window.LEDGER_CHANGELOG || []).map(item => `
  <div class="changelog-entry">
    <div class="changelog-entry-title">
      <span class="badge ${item.type === 'fix' ? 'rust' : ''}">${item.type === 'fix' ? 'Fix' : 'Feature'}</span>
      ${escapeHtml(item.title)}
      <span class="changelog-date">${escapeHtml(item.date)}</span>
    </div>
    <p class="changelog-entry-detail">${escapeHtml(item.detail)}</p>
  </div>`).join('') || '<p class="helptext">Nothing logged yet.</p>';
</script>
</body>
</html>
