[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# NFC minis: each sticker holds /t/<tag id>; the app reads ?tag= on load (see NFC-MINIS.md).
[[redirects]]
  from = "/t/:id"
  to = "/?tag=:id"
  status = 302

[dev]
  publish = "public"
  functions = "netlify/functions"
